name: Multi-Engine Dataset Automation

on:
  schedule:
    - cron: '0 0 * * 0' # Runs automatically every Sunday at midnight
  workflow_dispatch: # Allows manual trigger via the GitHub Actions UI

jobs:
  update-datasets:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Overrides Organization restrictions to grant file write access
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl-cffi beautifulsoup4

      - name: Execute Master Scraper
        run: python scraper_master.py

      - name: Commit and Push CSV Files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/*.csv
          git commit -m "Automated dataset refresh: Godot, Itch, Unity, Unreal" || exit 0
          git push
