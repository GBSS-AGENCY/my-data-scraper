name: Multi-Engine Dataset Automation

on:
  schedule:
    - cron: '0 0 * * 0' # Automatically runs once a week on Sunday at midnight
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub

jobs:
  update-datasets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Execute Master Scraper
        run: python scraper_master.py

      - name: Commit and Push CSV Files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/*.csv
          # The "|| exit 0" prevents the action from failing if no new assets were found
          git commit -m "Automated dataset refresh: Godot, Itch, Unity, Unreal" || exit 0
          git push
